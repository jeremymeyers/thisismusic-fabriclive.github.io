0 days, 100 CDs... lets go! #100dayschallenge #fabric #nightclub #djculture #compilationalbum", "date": "2025-08-19", "num": 100, "type": "final", "header": "TOP MIXES CHALLENGE"}, {"id": "7-rBpbxs3c4", "title": "FabricLive Top 100 complete. What a legacy. \ud83c\udf9b\ud83d\udd25 #fabriclive #djmixes #dancemusic", "date": "2025-12-07", "num": 999, "type": "final", "header": "Top Mixes RANKING"}];

        let currentFilter = 'all';
        let currentPage = 1;
        let searchQuery = '';
        let itemsPerPage = 50;

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        function createCard(video) {
            const card = document.createElement('a');
            card.href = `https://www.youtube.com/shorts/${video.id}`;
            card.target = "_blank";
            card.className = 'video-card group block';
            
            card.innerHTML = `
                <div class="relative aspect-[9/16] bg-white/5 border border-white/10 overflow-hidden mb-4 thumbnail-container">
                    <img src="https://img.youtube.com/vi/${video.id}/maxresdefault.jpg" 
                         onerror="this.src='https://img.youtube.com/vi/${video.id}/hqdefault.jpg'"
                         class="w-full h-full object-cover" 
                         loading="lazy"
                         alt="${video.title}">
                    <div class="absolute top-4 left-4 z-10">
                        <span class="text-[9px] font-bold bg-white text-black px-2 py-1 tracking-widest uppercase">${video.header}</span>
                    </div>
                </div>
                <div class="space-y-2">
                    <h3 class="text-[11px] font-bold text-white/90 uppercase tracking-tighter leading-tight  group-hover:text-white transition-colors">${video.title}</h3>
                    <p class="text-[10px] text-white font-medium uppercase tracking-[0.15em]">UPLOADED: ${video.date}</p>
                </div>
            `;
            return card;
        }

        
        function updateItemsPerPage(val) {
            itemsPerPage = val === 'all' ? videoData.length : parseInt(val);
            currentPage = 1;
            render();
        }

        function render() {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            const filtered = videoData.filter(v => {
                const matchesFilter = currentFilter === 'all' || v.type === currentFilter;
                const matchesSearch = v.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
            
            const start = (currentPage - 1) * itemsPerPage;
            const paginated = filtered.slice(start, start + itemsPerPage);

            paginated.forEach(video => {
                const card = createCard(video);
                grid.appendChild(card);
                observer.observe(card);
            });

            document.getElementById('total-count').textContent = `${filtered.length} ENTRIES`;
            document.getElementById('page-info').textContent = `PAGE ${currentPage} / ${totalPages || 1}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
            document.getElementById('pagination-controls').style.display = totalPages <= 1 ? 'none' : 'flex';
            lucide.createIcons();
        }

        function setFilter(filter) {
            currentFilter = filter;
            currentPage = 1;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextPage() { if (currentPage < Math.ceil(videoData.length/itemsPerPage)) { currentPage++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
        function prevPage() { if (currentPage > 1) { currentPage--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 1;
            render();
        });

        render();
    </script>
